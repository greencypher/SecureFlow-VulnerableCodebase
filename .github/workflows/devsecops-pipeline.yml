name: SecureFlow DevSecOps Pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # =========================
  # GITLEAKS SECRET SCAN
  # =========================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4 | sed 's/v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (full history scan)
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
  # =========================
  # SONARQUBE CLOUD
  # =========================
  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=greencypher
            -Dsonar.projectKey=greencypher_SecureFlow-VulnerableCodebase
            -Dsonar.sources=.

      - name: Retrieve SonarQube findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: greencypher_SecureFlow-VulnerableCodebase
        run: |
          curl -sS \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&statuses=OPEN,CONFIRMED,REOPENED&ps=500" \
            -o sonar-issues.json

          jq --arg project "$SONAR_PROJECT_KEY" '{
            project: $project,
            issues: [
              .issues[] |
              {
                key: .key,
                rule: .rule,
                severity: .severity,
                type: .type,
                message: .message,
                component: .component,
                line: .line,
                status: .status
              }
            ]
          }' sonar-issues.json > sonar-findings.json

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json

      - name: Enforce SonarQube security gate
        run: |
          critical=$(jq '[.issues[] | select(.severity == "CRITICAL")] | length' sonar-findings.json)
          blocker=$(jq '[.issues[] | select(.severity == "BLOCKER")] | length' sonar-findings.json)

          echo "CRITICAL findings: $critical"
          echo "BLOCKER findings: $blocker"

          if [ "$critical" -gt 0 ] || [ "$blocker" -gt 0 ]; then
            echo "::error::SonarQube security gate FAILED"
            exit 1
          fi

          echo "SonarQube security gate PASSED"

      # =========================
      # DETECT AND ROUTE SONARQUBE FINDINGS
      # =========================
      - name: Retrieve SonarQube findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: greencypher_SecureFlow-VulnerableCodebase
        run: |
          curl -sS \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&statuses=OPEN,CONFIRMED,REOPENED&ps=500" \
            -o sonar-issues.json

          # Fail if the SonarCloud API returned an error
          if jq -e '.errors' sonar-issues.json > /dev/null; then
            echo "::error::Failed to retrieve SonarQube findings"
            cat sonar-issues.json
            exit 1
          fi

          # Create the JSON artifact for the security gate
          jq --arg project "$SONAR_PROJECT_KEY" '{
            project: $project,
            generated_at: (now | todate),
            findings: [
              .issues[] |
              {
                key: .key,
                rule: .rule,
                severity: .severity,
                type: .type,
                message: .message,
                component: .component,
                line: .line,
                status: .status
              }
            ]
          }' sonar-issues.json > sonar-findings.json

          echo "Findings artifact created."

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json
          if-no-files-found: error

      # =========================
      # SECURITY GATE
      # HARD-FAIL ONLY ON CRITICAL/BLOCKER
      # =========================
      - name: Enforce SonarQube security gate
        run: |
          critical=$(jq '[.findings[] | select(.severity == "CRITICAL")] | length' sonar-findings.json)
          blocker=$(jq '[.findings[] | select(.severity == "BLOCKER")] | length' sonar-findings.json)

          echo "CRITICAL findings: $critical"
          echo "BLOCKER findings: $blocker"

          # Show findings that triggered the gate
          jq '
            .findings[]
            | select(.severity == "CRITICAL" or .severity == "BLOCKER")
            | {
                severity,
                type,
                rule,
                message,
                component,
                line
              }
          ' sonar-findings.json

          if [ "$critical" -gt 0 ] || [ "$blocker" -gt 0 ]; then
            echo "::error::SonarQube security gate FAILED due to CRITICAL/BLOCKER findings"
            exit 1
          fi

          echo "SonarQube security gate PASSED"
